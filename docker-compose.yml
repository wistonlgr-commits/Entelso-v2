services:
  # ─────────────────────────────────────────────────
  # Backend API (Node.js + Express)
  # Conecta a PostgreSQL / Supabase via DATABASE_URL en ./backend/.env
  # ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: entelso_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    networks:
      - entelso_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ─────────────────────────────────────────────────
  # Frontend Dashboard (Nginx + Reverse Proxy /api & /health)
  # ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: entelso_dashboard
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - entelso_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  entelso_network:
    name: entelso_network
    driver: bridge
